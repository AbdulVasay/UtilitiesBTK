<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BTK Bills Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">

    <header class="app-header mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-lg-4">
                <h1 class="app-title">🏠 BTK Bills</h1>
                <div class="app-subtitle">Bahria Town Karachi · Electricity, Water &amp; Maintenance</div>
            </div>
            <div class="col-6 col-lg-3">
                <label class="form-label" for="bill_month">Billing Month</label>
                <input type="month" class="form-control" id="bill_month">
            </div>
            <div class="col-6 col-lg-3">
                <label class="form-label" for="saved_months">Saved Months</label>
                <div class="input-group">
                    <select class="form-select" id="saved_months">
                        <option value="">-- Select --</option>
                    </select>
                    <button class="btn btn-light border" type="button" id="delete_month" title="Delete this month">🗑️</button>
                </div>
            </div>
            <div class="col-lg-2 d-grid">
                <button class="btn btn-save" type="button" id="save_month">💾 Save Month</button>
            </div>
        </div>
        <div class="month-status" id="month_status"></div>
    </header>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="total-tile u-electric"><div class="label">⚡ Electric</div><div class="value" data-total="electric">—</div></div></div>
        <div class="col-6 col-md-3"><div class="total-tile u-water"><div class="label">💧 Water</div><div class="value" data-total="water">—</div></div></div>
        <div class="col-6 col-md-3"><div class="total-tile u-maintenance"><div class="label">🛠️ Maintenance</div><div class="value" data-total="maintenance">—</div></div></div>
        <div class="col-6 col-md-3"><div class="total-tile grand"><div class="label">Total within due date</div><div class="value" data-total="all">—</div></div></div>
    </div>

    <ul class="nav nav-pills app-tabs mb-3" role="tablist">
        <li class="nav-item"><button class="nav-link active u-electric" data-bs-toggle="pill" data-bs-target="#tab-electric" type="button">⚡ Electric</button></li>
        <li class="nav-item"><button class="nav-link u-water" data-bs-toggle="pill" data-bs-target="#tab-water" type="button">💧 Water</button></li>
        <li class="nav-item"><button class="nav-link u-maintenance" data-bs-toggle="pill" data-bs-target="#tab-maintenance" type="button">🛠️ Maintenance</button></li>
        <li class="nav-item"><button class="nav-link u-summary" data-bs-toggle="pill" data-bs-target="#tab-summary" type="button">📋 Summary</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active u-electric" id="tab-electric">
            <div class="row g-4">
                <div class="col-lg-6"><div class="app-card" id="form-electric"></div></div>
                <div class="col-lg-6"><div class="app-card" id="result-electric"></div></div>
            </div>
        </div>
        <div class="tab-pane fade u-water" id="tab-water">
            <div class="row g-4">
                <div class="col-lg-6"><div class="app-card" id="form-water"></div></div>
                <div class="col-lg-6"><div class="app-card" id="result-water"></div></div>
            </div>
        </div>
        <div class="tab-pane fade u-maintenance" id="tab-maintenance">
            <div class="row g-4">
                <div class="col-lg-6"><div class="app-card" id="form-maintenance"></div></div>
                <div class="col-lg-6"><div class="app-card" id="result-maintenance"></div></div>
            </div>
        </div>
        <div class="tab-pane fade u-summary" id="tab-summary">
            <div class="app-card" id="summary"></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/billing-calc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
